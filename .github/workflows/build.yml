name: Build

on:
  push:
    branches: [ main, "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build MiladyLoader.exe
        run: >
          dotnet publish src/MiladyLoader/MiladyLoader.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o package/MiladyLoader

      - name: Assemble download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/MiladyLoader/mods | Out-Null
          Set-Content package/MiladyLoader/mods/PUT_MODS_HERE.txt "Put each mod's folder (the one containing mod.json) in here, then run MiladyLoader.exe."
          Copy-Item README.md, LICENSE, NOTICE.md package/MiladyLoader/
          Copy-Item docs package/MiladyLoader/docs -Recurse
          Copy-Item examples package/MiladyLoader/examples -Recurse
          Get-ChildItem -Recurse package | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MiladyLoader-${{ github.sha }}
          path: package

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path package/MiladyLoader -DestinationPath MiladyLoader-${{ github.ref_name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MiladyLoader-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
